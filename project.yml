name: Ridge
options:
  bundleIdPrefix: app.daphnis
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    # 个人 Team：稳定签名后日历 / 辅助功能等 TCC 才不会每次重装都丢。
    DEVELOPMENT_TEAM: 444ULG6V8C
    ENABLE_HARDENED_RUNTIME: true
# macOS 15.4+ MediaRemote 仅对 Apple 签名进程应答；经 perl 桥读取 Now Playing。
packages:
  MediaRemoteAdapter:
    url: https://github.com/ejbills/mediaremote-adapter
    revision: 5b6afde3f501a3da567e23bf7f23d562938a1809
targets:
  Ridge:
    type: application
    platform: macOS
    sources:
      - path: Ridge
        excludes:
          - "**/.DS_Store"
          - "Resources/Legal"
          - "Resources/Onboarding"
      - path: Ridge/Resources/Legal
        type: folder
        buildPhase: resources
      - path: Ridge/Resources/Onboarding
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.daphnis.Ridge
        PRODUCT_NAME: Ridge
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_FILE: Ridge/Info.plist
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_OBJC_BRIDGING_HEADER: Ridge/Ridge-Bridging-Header.h
        DEVELOPMENT_TEAM: 444ULG6V8C
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: IOBluetooth.framework
      - sdk: CoreBluetooth.framework
      - sdk: IOKit.framework
      - sdk: ServiceManagement.framework
      - package: MediaRemoteAdapter
        product: MediaRemoteAdapter
        embed: true
        link: true
    entitlements:
      path: Ridge/Ridge.entitlements
      properties:
        com.apple.security.get-task-allow: true
        com.apple.security.personal-information.calendars: true
        # 外设卡片打开系统蓝牙设置（AppleScript 揭面板）
        com.apple.security.automation.apple-events: true

  RidgeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RidgeTests
    dependencies:
      - target: Ridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.daphnis.RidgeTests
        GENERATE_INFOPLIST_FILE: true
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        DEVELOPMENT_TEAM: 444ULG6V8C
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ridge.app/Contents/MacOS/Ridge"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Ridge:
    build:
      targets:
        Ridge: all
        RidgeTests: [test]
    test:
      targets:
        - RidgeTests
